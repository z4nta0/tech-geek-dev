<!doctype html><!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'><!-- What: Root HTML Element. Why: The card is set in English text. How: This marks the document as English. -->


	<head><!-- What: Document Head Element. Why: The card's fonts and layout load before it's captured. How: This holds them in the sections below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />                         <!-- What: Character Set Meta. Why: The card's text has to decode as UTF-8. How: This sits first in the head. -->
		<title>TechGeek.dev Social Preview Card</title> <!-- What: Page Title Element. Why: The file should say what it is when opened in a browser. How: This names the card. -->

		<!-- #endregion Document -->


		<!-- #region Card Styles -->

		<style>/* What: Card Style Element. Why: The card is one fixed-size image, styled here from the site's own fonts and tokens. How: This imports the site's font faces and global stylesheet, then lays out the card. */


			@import url( '../../src/styles/fonts.css' );  /* What: Site Fonts Import. Why: The card should be set in the site's own typefaces. How: This loads the site's font faces, whose file paths resolve from that stylesheet's own folder. */
			@import url( '../../src/styles/styles.css' ); /* What: Site Styles Import. Why: The card should read the site's colors and scale rather than copies of them. How: This loads the global tokens and base styles, including the 11px root the rem steps assume. */



			/* #region carBodBod */

			.carBodBod { /* What: Card Body Body. Why: The card fills the whole 1,200x630 capture on the site's ivory page color. How: This sizes it in literal pixels, the image's own fixed size, and centers its column both ways. */


				align-items     : center;
				background      : var( --bac-pag-col ); /* Background Page Color = #F5F0E8 */
				display         : flex;
				height          : 630px;
				justify-content : center;
				overflow        : hidden;
				position        : relative;
				width           : 1200px;


			}


			/* #region hexDecSvg */

			.hexDecSvg { /* What: Hexagon Decoration SVG. Why: Outlined hexagons at the card's sides echo the site's geometric background without crowding the center square some apps crop to. How: This lays the drawing over the whole card behind the column. */


				inset    : 0;
				position : absolute;


			}

			.hexOutPol { /* What: Hexagon Outline Polygon. Why: The side hexagons stay quiet so the mark and name lead. How: This outlines each in the border color. */


				fill         : none;
				stroke       : var( --bor-mai-col ); /* Border Main Color = #D8CFBE */
				stroke-width : 2;


			}

			.hexAccPol { /* What: Hexagon Accent Polygon. Why: One orange hexagon on each side ties the decoration to the brand. How: This outlines it in the main accent. */


				fill         : none;
				stroke       : var( --acc-mai-col ); /* Accent Main Color = #F26419 */
				stroke-width : 3;


			}

			/* #endregion hexDecSvg */



			/* #region carColDiv */

			.carColDiv { /* What: Card Column Div. Why: Some apps crop the card to its center square, so everything that matters sits inside the middle 630px. How: This stacks the mark, the wordmark, the role, and the name in one centered column above the decoration. */


				align-items    : center;
				display        : flex;
				flex-direction : column;
				position       : relative;
				text-align     : center;


			}

			.hexMarSvg { /* What: Hexagon Mark SVG. Why: The site's hexagon mark makes the card recognizable at a glance. How: This sizes the nav's mark at the site's p09 rhythm step, large enough to lead the column. */


				display : block;
				height  : calc( var( --ver-rhy-p09 ) * 1rem ); /* Vertical Rhythm Base Plus 9 ~= 183.074px */
				width   : calc( var( --ver-rhy-p09 ) * 1rem ); /* Vertical Rhythm Base Plus 9 ~= 183.074px */


			}


			/* #region braWorPar */

			.braWorPar { /* What: Brand Wordmark Paragraph. Why: The site's name reads under its mark, set as the nav sets it. How: This sets it bold in the display font, a little tight, at the p05 step, the largest that keeps Syne's wide letters inside the center square. */


				font-family    : var( --fon-fam-mai ); /* Font Family Main = 'Syne', sans-serif */
				font-size      : var( --fon-siz-p05 ); /* Font Size Base Plus 5 ~= 44.876px */
				font-weight    : 800;
				letter-spacing : -0.03em;
				line-height    : var( --ver-rhy-m01 ); /* Vertical Rhythm Base Minus 1 = 1 */
				margin-top     : var( --spa-ver-p02 ); /* Spacing Vertical Base Plus 2 ~= 25.572px */


			}

			.worFirSpa { /* What: Wordmark First Span. Why: The brand reads in the main text color, as in the nav. How: This sets TechGeek in the ink. */


				color : var( --tex-mai-col ); /* Text Main Color = #1A1A2E */


			}

			.worLasSpa { /* What: Wordmark Last Span. Why: The domain ending carries the accent, as in the nav. How: This sets .dev in the dark orange. */


				color : var( --acc-dar-col ); /* Accent Dark Color ~= #bd3000 */


			}

			/* #endregion braWorPar */


			.rolTitPar { /* What: Role Title Paragraph. Why: The card says what the site's owner does, large enough to read at thumbnail size and set apart from the wordmark. How: This sets it in the accent serif's italic, narrower than Syne, in the secondary text color under the wordmark. */


				color       : var( --tex-sec-col ); /* Text Secondary Color = #3D3D5C */
				font-family : var( --fon-fam-acc ); /* Font Family Accent = 'Lora', serif */
				font-size   : var( --fon-siz-p05 ); /* Font Size Base Plus 5 ~= 44.876px */
				font-style  : italic;
				line-height : var( --ver-rhy-m01 ); /* Vertical Rhythm Base Minus 1 = 1 */
				margin-top  : var( --spa-ver-p03 ); /* Spacing Vertical Base Plus 3 ~= 33.876px */


			}

			.ownNamPar { /* What: Owner Name Paragraph. Why: The card names whose portfolio it is. How: This sets z4nta0 in the mono font in the dark orange, the way the site sets its labels. */


				color       : var( --acc-dar-col ); /* Accent Dark Color ~= #bd3000 */
				font-family : var( --fon-fam-sec ); /* Font Family Secondary = 'DM Mono', monospace */
				font-size   : var( --fon-siz-p05 ); /* Font Size Base Plus 5 ~= 44.876px */
				line-height : var( --ver-rhy-m01 ); /* Vertical Rhythm Base Minus 1 = 1 */
				margin-top  : var( --spa-ver-p01 ); /* Spacing Vertical Base Plus 1 ~= 19.304px */


			}

			/* #endregion carColDiv */

			/* #endregion carBodBod */


		</style>

		<!-- #endregion Card Styles -->


	</head>



	<body class='carBodBod'><!-- What: Card Body Body Element. Why: This is the card itself. How: It holds the side decoration and the centered column. -->


		<svg
			class='hexDecSvg'

			viewBox='0 0 1200 630'

			aria-hidden='true'
		><!-- What: Hexagon Decoration SVG Element. Why: The sides echo the site's geometric look. How: This draws outlined hexagons left and right of the center square, hidden from screen readers since it's decoration. -->


			<polygon
				class='hexOutPol'

				points='150,40 240,92 240,196 150,248 60,196 60,92'
			/><!-- What: Hexagon Outline Polygon Element. Why: The left side carries a quiet hexagon. How: This draws it near the top left. -->

			<polygon
				class='hexAccPol'

				points='190,330 250,365 250,435 190,470 130,435 130,365'
			/><!-- What: Hexagon Accent Polygon Element. Why: The left side carries one orange hexagon. How: This draws it below the first. -->

			<polygon
				class='hexOutPol'

				points='90,470 150,505 150,575 90,610 30,575 30,505'
			/><!-- What: Hexagon Outline Polygon Element. Why: The left side carries a small quiet hexagon. How: This draws it near the bottom left. -->

			<polygon
				class='hexOutPol'

				points='1050,382 1140,434 1140,538 1050,590 960,538 960,434'
			/><!-- What: Hexagon Outline Polygon Element. Why: The right side mirrors the left. How: This draws a quiet hexagon near the bottom right. -->

			<polygon
				class='hexAccPol'

				points='1010,160 1070,195 1070,265 1010,300 950,265 950,195'
			/><!-- What: Hexagon Accent Polygon Element. Why: The right side carries one orange hexagon. How: This draws it above the large one. -->

			<polygon
				class='hexOutPol'

				points='1110,20 1170,55 1170,125 1110,160 1050,125 1050,55'
			/><!-- What: Hexagon Outline Polygon Element. Why: The right side carries a small quiet hexagon. How: This draws it near the top right. -->


		</svg>


		<div class='carColDiv'><!-- What: Card Column Div Element. Why: The card's content sits in one centered column. How: This stacks the mark, the wordmark, the role, and the name. -->


			<svg
				class='hexMarSvg'

				fill='none'
				viewBox='0 0 28 28'

				aria-hidden='true'
			><!-- What: Hexagon Mark SVG Element. Why: The site's mark leads the card. How: This draws the nav's mark, hidden from screen readers since the wordmark names it. -->


				<polygon
					fill='none'
					points='14,2 26,8 26,20 14,26 2,20 2,8'
					stroke='#F26419'
					stroke-width='2'
				/><!-- What: Outer Hexagon Polygon Element. Why: The mark's outline is an orange hexagon. How: This traces it in the main accent, #F26419. -->

				<polygon
					fill='#7DB9D8'
					opacity='0.6'
					points='14,7 21,11 21,17 14,21 7,17 7,11'
				/><!-- What: Inner Hexagon Polygon Element. Why: A softer blue hexagon fills the mark's center. How: This draws it in the secondary accent, #7DB9D8, at 60% strength. -->

				<circle
					cx='14'
					cy='14'
					fill='#F26419'
					r='3'
				/><!-- What: Center Dot Circle Element. Why: An orange dot finishes the mark. How: This draws it in the main accent at the center. -->


			</svg>

			<p class='braWorPar'><span class='worFirSpa'>TechGeek</span><span class='worLasSpa'>.dev</span></p><!-- What: Brand Wordmark Paragraph Element. Why: The site's name reads under its mark. How: This sets its two parts in their own colors. -->

			<p class='rolTitPar'>Full Stack Web Developer</p><!-- What: Role Title Paragraph Element. Why: The card says what the owner does. How: This shows the role. -->

			<p class='ownNamPar'>z4nta0</p><!-- What: Owner Name Paragraph Element. Why: The card names whose portfolio it is. How: This shows the name. -->


		</div>


	</body>


</html>
